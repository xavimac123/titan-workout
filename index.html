<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E0E10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Titan">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Titan Workout</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1 class="brand"><img src="icon.svg" alt="" width="28" height="28"> TITAN <span>WORKOUT</span></h1>
    <button id="btnSettings" class="icon-btn" aria-label="Ajustes">⚙</button>
  </header>

  <main id="view"></main>

  <nav class="tabs hidden" id="tabs" aria-label="Principal">
    <a href="#inicio" data-tab="inicio" aria-label="Inicio" title="Inicio"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></a>
    <a href="#hoy" data-tab="hoy" aria-label="Hoy" title="Hoy"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg></a>
    <a href="#semana" data-tab="semana" aria-label="Semana" title="Semana"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01"/></svg></a>
    <a href="#progreso" data-tab="progreso" aria-label="Progreso" title="Progreso"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M5 16l4-5 4 3 6-8"/><path d="M15 6h4v4"/></svg></a>
    <a href="#biblioteca" data-tab="biblioteca" aria-label="Biblioteca" title="Biblioteca"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.3"/><path d="M12 8v6M12 9.5L7 8M12 9.5L17 8M12 14l-3.5 6M12 14l3.5 6"/></svg></a>
  </nav>

  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
    <div class="backdrop" data-a="closeSheet"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

  <div id="pop" class="pop hidden" role="dialog" aria-modal="true"><div class="backdrop" data-a="closePop"></div><div class="pop-body" id="popBody"></div></div>
  <div id="tmr" class="tmr hidden" role="dialog" aria-modal="true"><div class="tmr-body" id="tmrBody"></div></div>

  <div id="restBar" class="rest hidden" role="timer" aria-live="off">
    <span id="restLbl">Descanso</span>
    <span id="restTime">00:00</span>
    <button id="restSkip" class="ghost">Saltar</button>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="js/catalog.js"></script>
  <script src="js/figura.js"></script>
  <script src="js/nombres.js"></script>
  <script src="js/anim.js"></script>
  <script src="js/ejercicios2.js"></script>
  <script src="js/ejercicios3.js"></script>
  <script src="js/ejercicios4.js"></script>
  <script src="js/cuerpo3d.js"></script>
  <script src="js/db.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
