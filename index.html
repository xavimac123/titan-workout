<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E0E10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Titan">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Titan Workout</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1 class="brand">TITAN <span>WORKOUT</span></h1>
    <button id="btnSettings" class="icon-btn" aria-label="Ajustes">⚙</button>
  </header>

  <main id="view"></main>

  <nav class="tabs hidden" id="tabs" aria-label="Principal">
    <a href="#hoy" data-tab="hoy">Hoy</a>
    <a href="#semana" data-tab="semana">Semana</a>
    <a href="#ruta" data-tab="ruta">Ruta</a>
    <a href="#progreso" data-tab="progreso">Progreso</a>
    <a href="#biblioteca" data-tab="biblioteca">Biblioteca</a>
  </nav>

  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
    <div class="backdrop" data-a="closeSheet"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

  <div id="restBar" class="rest hidden" role="timer" aria-live="off">
    <span id="restLbl">Descanso</span>
    <span id="restTime">00:00</span>
    <button id="restSkip" class="ghost">Saltar</button>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="js/catalog.js"></script>
  <script src="js/db.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
